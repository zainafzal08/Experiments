            <select name="stats-type" id="stats-type">

                <option value="ms">MS</option>
                <option value="mb">Memory</option>
            </select>
        </div>

            <select name="cloud-configerations" id="cloud-configerations">
            </select>
        </div>
        <label for="point-size">Point Size</label>
        <input type="range" min="0.1" max="5" value="1" step=".1" id="point-size">
        <label for="point-count">Point Count (<span id="point-count-val"></span>)</label>
        <input type="range" min="64" max="5000" step="1" id="point-count">
